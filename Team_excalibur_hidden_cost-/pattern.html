<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.1/css/boxicons.min.css" />
    <style>
        /* Define color variables */
        :root {
            --bg-color: #081b29;
            /* Example color, adjust as needed */
            --text-color: #E0FFFF;
            --main-color: #00FA9A;
            --secondary-bg-color: #112e42;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #081b29;
                --text-color: #E0FFFF;
                --main-color: #00FA9A;
                --secondary-bg-color: #112e42;
                /* Adjust as needed */
            }
        }

        /* Apply background styling */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: #E0FFFF solid 2px;
            padding-right: 10px;
            padding-left: 10px;
            height: auto;
            width: 350px;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.85em;
        }

        .back_button {
            font-size: 2.4rem;
            color: var(--main-color);
            /* Changed from --bg-color to --main-color */
            transition: .5s;
            position: relative;
            display: inline-block;
            overflow: hidden;
            z-index: 1;
            text-decoration: none;
            margin-top: 10px;
            margin-right: 100%;
        }

        .back_button::before {
            content: '';
            position: absolute;
            margin-top: 2px;
            top: 0;
            left: 0;
            width: 100%;
            height: 85%;
            border-radius: 5px;
            background: var(--main-color);
            transform: scaleX(0);
            transition: .5s;
            z-index: -1;
        }

        .back_button:hover {
            color: var(--bg-color);
            /* Changed from --main-color to --bg-color */
        }

        .back_button:hover::before {
            transform: scaleX(1);
        }
    </style>
    <script type="module" src="pattern.js"></script>
</head>

<body>
    <a class="back_button" href="popup.html"><i class="bx bx-left-arrow-alt"></i></a>
    <extension-popup></extension-popup>
</body>

</html>
